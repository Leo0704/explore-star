# 燃点 FDE 业务画像（脱敏示例）
#
# 本文件是「business.example/燃点-FDE/」下的示例配置——
# 展示**作者的真实业务**如何用探星框架。
#
# 业务方在 init 后，应该把整个目录复制为 business-<你的业务名>/，
# 然后**只改这 3-5 个字段**为自己的业务：
#   - business.name
#   - business.value_prop
#   - target_personas
#   - intent_signals
#   - crm.type / crm.config

business:
  name: "燃点 FDE"
  value_prop: "派工程师到企业现场做定制化 AI 落地"
  description: |
    燃点 FDE 是一家 OPC 一人公司，专为小微企业提供
    「工程师驻场定制化 AI 落地」服务。已积累 30+ 企业客户、
    6 周交付、98% 复购率。

target_personas:
  - id: ai_beginner
    name: "AI 小白企业"
    description: "想用 AI 但不知道怎么开始的企业"
    typical_pain_points:
      - "AI 落地难"
      - "不知道怎么用 AI"
      - "AI 工具太多不知道选哪个"
      - "想用 AI 提效但不会搞"
    value_score: 8.0  # 由 §3.11 自动调整

  - id: ai_stuck
    name: "AI 卡壳企业"
    description: "已经在用 AI 但效果不好的企业"
    typical_pain_points:
      - "AI 效果不好"
      - "AI 工具不好用"
      - "AI 落地后没人会用"
      - "AI 投入产出比低"
    value_score: 9.0  # 已经在用 AI，说明有预算和需求

intent_signals:
  - "AI 落地"
  - "AI 效果不好"
  - "AI 怎么用"
  - "AI 工具不好用"
  - "AI 落地难"
  - "有没有靠谱的 AI"
  - "AI 能不能提效"
  - "AI 能不能省人工"

buying_stages:
  - id: awareness
    name: "刚意识到问题"
    description: "表达困惑、刚遇到问题、不知道有 AI 解决方案"
  - id: consideration
    name: "在调研比价"
    description: "在找 AI 工具、在比价、问别人推荐"
  - id: decision
    name: "准备找人"
    description: "明确要做、问报价、问工期、预算已就绪"

llm:
  provider: custom
  model: mimo-v2.5-pro
  api_key_env: CUSTOM_API_KEY
  base_url: "https://token-plan-sgp.xiaomimimo.com/v1"
  temperature: 0.3
  max_tokens: 4000

# Q1 切换：embedding 改用国产通义千问（阿里云百炼）
# 申请 API Key：https://bailian.console.aliyun.com/
# 设置环境变量：export DASHSCOPE_API_KEY=sk-xxxxxxxx
# 跟 src/adapters/embeddings/qwen.ts + src/rag/index-builder.ts:65 保持一致
# （schema 用 float[1024] 对应 text-embedding-v3 默认维度）
embedding:
  provider: qwen
  model: text-embedding-v3
  api_key_env: DASHSCOPE_API_KEY
  dimensions: 1024

crm:
  type: feishu
  # field_mapping 见 crm.yaml（更细的字段映射）
  # 这里只放最小连接信息
  config:
    app_id_env: FEISHU_APP_ID
    app_secret_env: FEISHU_APP_SECRET
    table_id: "FDE意向客户池"

hook_config:
  style: "朋友推荐，不像销售"
  max_length: 30
  language: "中文"
  # A/B 测试风格池（§3.11 反馈分析器会评估）
  styles:
    - "朋友推荐"
    - "顾问"
    - "案例引用"

feedback_config:
  auto_apply:
    keyword_weight: true       # 关键词权重可自动调
    hook_style: false          # 钩子风格必须手动确认
    persona_value: false       # persona 价值必须手动确认
    interaction_time: false    # 互动时段必须手动确认

  observability:
    run_history:
      enabled: true
    notifier:
      enabled: true
      channels: ['console']
