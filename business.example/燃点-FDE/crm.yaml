# 燃点 FDE 飞书多维表配置（脱敏示例）

crm:
  type: feishu          # 必填：feishu | notion | airtable | csv | custom

  config:
    # 飞书开放平台应用凭证
    app_id_env: FEISHU_APP_ID           # 环境变量名（运行时读 $FEISHU_APP_ID）
    app_secret_env: FEISHU_APP_SECRET   # 环境变量名
    table_id: "FDE意向客户池"            # 飞书多维表的 table_id

    # 字段映射：探星标准 Lead 字段 → 飞书多维表字段
    # （业务方按自己表里的实际列名修改）
    field_mapping:
      # 标准字段          飞书字段名
      nickname:           "抖音昵称"
      comment:            "评论原文"
      video_url:          "视频链接"
      video_desc:         "视频标题"
      keyword:            "来源关键词"
      pain_point:         "痛点"
      persona:            "人设"
      intent_score:       "意向分"
      buying_stage:       "购买阶段"
      hook_reply:         "钩子_评论用"
      hook_dm:            "钩子_私信用"
      status:             "状态"
      today_task:         "今日任务"
      created_at:         "创建时间"
      last_interaction:   "最后互动"
      notes:              "备注"
      execution_count:    "已执行任务数"
      response_count:     "已回应次数"
      wechat_added_at:    "加微时间"
      booked_at:          "预约时间"
      closed_at:          "成交时间"
      revenue:            "营收"

    # 多选字段的选项（飞书多维表需要预定义）
    persona_options:
      - "AI 小白企业"
      - "AI 卡壳企业"

    status_options:
      - "新发现"
      - "已关注"
      - "已互动"
      - "已加好友"
      - "已加微"
      - "已预约"
      - "已成交"
      - "已流失"
      - "沉默"
      - "已再激活"
