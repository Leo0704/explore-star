# 燃点 FDE 渠道配置（脱敏示例）
#
# V1.4 架构：source.mode 决定走哪条路径
#   - sec_uid: 用 opencli douyin user-videos --with_comments 拉目标 KOL 视频+评论（**推荐**）
#   - keyword: 用 opencli douyin search 拉关键词视频（评论=0，需二次调用）
#   - both: 两条路径都跑

source:
  mode: "keyword" # E2E: keyword 模式

# === 模式 B: 目标 KOL（推荐）===
target_sec_uids:
  sec_uids: []
  # 业务方需要在这里填入真实的 KOL sec_uid 列表
  # 获取方式：打开 KOL 抖音主页（如 https://www.douyin.com/user/MS4wLjABAAAAxxxxxx），
  # URL 末尾那段就是 sec_uid
  #
  # 燃点 FDE 目标 KOL 示例（脱敏后为空）：
  #   - 财经类：「王老师讲商业」类账号
  #   - 自媒体类：「新榜」类行业媒体
  #   - 工具评测类：「AI 工具评测」类账号
  #
  # V1.4 起步建议：先填 5-10 个熟悉的目标 KOL，跑通流程
  # V1.4 进阶：每周加 5 个，1 个月达到 30 个
  user_videos_limit: 20 # opencli 硬上限 20
  comment_limit: 10 # opencli 硬上限 10

# === 模式 A: 关键词搜索（备选）===
search:
  keywords:
    "AI 落地":
      # 关键词 1 - 找不知道怎么开始的企业
      weight: 1.0
    "AI 效果不好":
      # 关键词 2 - 找遇到问题的企业
      weight: 1.0
    "AI 怎么用":
      # 关键词 3 - 找不知道怎么用的企业
      weight: 0.9
    "AI 工具不好用":
      # 关键词 4 - 找对工具失望的企业
      weight: 0.9
    "AI 落地难":
      # 关键词 5 - 找觉得落地难的企业
      weight: 0.8
    "靠谱的 AI":
      # 关键词 6 - 找在找靠谱方案的企业
      weight: 0.8
    "AI 能不能提效":
      # 关键词 7 - 找在评估 AI 可行性的企业
      weight: 0.7
    "AI 能不能省人工":
      # 关键词 8 - 找明确需要省人工的企业
      weight: 1.0
  # 注：opencli 1.x 限制 --limit ≤ 30，强行 --limit 50 会被截断
  limit_per_keyword: 10

# === 通用筛选 ===
filters:
  min_likes: 100 # 过滤低质量视频
  max_age_days: 30 # 只看最近一个月的

comment_filters:
  min_length: 4 # 太短的评论无意义
  exclude_emoji_only: true
  exclude_punctuation_only: true
  exclude_marketing: true # 由 LLM 判断（§3.3 intent-analyzer）
