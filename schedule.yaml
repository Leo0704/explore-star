# 探星定时任务配置
#
# 使用方式：
#   npx explore-star schedule --install     安装到系统 crontab
#   npx explore-star schedule --list        查看已安装的任务
#   npx explore-star schedule --uninstall   卸载
#
# cron 格式：分 时 日 月 周
#   0 9 * * *     = 每天 09:00
#   0 3 * * 0     = 每周日 03:00
#   0 10 1 * *    = 每月 1 日 10:00

jobs:
  - name: "主流程（侦察 + 分析 + 生成任务 + 自动执行 + 早报）"
    cron: "0 9 * * *"
    command: "run"

  - name: "晚报（今日互动统计）"
    cron: "0 18 * * *"
    command: "daily-report"

  - name: "转化日报（漏斗/营收/ROI）"
    cron: "0 22 * * *"
    command: "conversion-report"

  - name: "反馈分析（关键词归因/钩子风格/persona 价值/互动时段）"
    cron: "0 3 * * 0"
    command: "insights"

  - name: "优化建议推送"
    cron: "0 9 * * 1"
    command: "optimization-report"

  - name: "沉默客户再激活"
    cron: "0 10 1 * *"
    command: "reactivate"

  - name: "健康检查"
    cron: "0 */6 * * *"
    command: "doctor"
